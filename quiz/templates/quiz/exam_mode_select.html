{% extends "base/base.html" %}

{% block title %}
انتخاب حالت آزمون
{% endblock %}

{% block content %}
<main class="min-h-screen bg-slate-950 px-6 py-10 text-white">
    <div class="mx-auto max-w-5xl">

        <div class="mb-10 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
                <h1 class="text-4xl font-black">
                    انتخاب حالت آزمون
                </h1>

                <p class="mt-3 text-slate-400">
                    یکی از حالت‌های تمرین، مطالعه یا آزمون واقعی را انتخاب کن.
                </p>
            </div>

            <a
                href="/dashboard/"
                class="rounded-2xl border border-white/10 bg-white/5 px-5 py-3 font-bold hover:bg-white/10"
            >
                برگشت به داشبورد
            </a>
        </div>

        <form method="post" class="grid gap-5 md:grid-cols-3">
            {% csrf_token %}

            <button
                type="submit"
                name="mode"
                value="practice"
                class="rounded-[2rem] border border-blue-400/30 bg-blue-500/10 p-6 text-right transition hover:bg-blue-500/20"
            >
                <div class="text-5xl">📚</div>
                <h2 class="mt-5 text-2xl font-black text-blue-300">
                    حالت تمرین
                </h2>
                <p class="mt-3 leading-8 text-slate-300">
                    سوال را حل کن و بعد ادامه بده. مناسب برای یادگیری قدم‌به‌قدم.
                </p>
            </button>

            <button
                type="submit"
                name="mode"
                value="read"
                class="rounded-[2rem] border border-yellow-400/30 bg-yellow-500/10 p-6 text-right transition hover:bg-yellow-500/20"
            >
                <div class="text-5xl">📖</div>
                <h2 class="mt-5 text-2xl font-black text-yellow-300">
                    حالت مطالعه
                </h2>
                <p class="mt-3 leading-8 text-slate-300">
                    سوال‌ها را بخوان و مرور کن، بدون فشار آزمون و زمان.
                </p>
            </button>

            <button
                type="submit"
                name="mode"
                value="test"
                class="rounded-[2rem] border border-green-400/30 bg-green-500/10 p-6 text-right transition hover:bg-green-500/20"
            >
                <div class="text-5xl">📝</div>
                <h2 class="mt-5 text-2xl font-black text-green-300">
                    حالت آزمون واقعی
                </h2>
                <p class="mt-3 leading-8 text-slate-300">
                    آزمون زمان‌دار با ارزیابی نهایی، شبیه آزمون واقعی.
                </p>
            </button>

        </form>

    </div>
</main>
{% endblock %}
