{% extends "base/base.html" %}

{% block title %}ورود{% endblock %}

{% block content %}
<div class="flex min-h-screen items-center justify-center px-6 py-12">

    <div class="w-full max-w-md rounded-[2rem] border border-white/10 bg-white/5 p-8 shadow-2xl backdrop-blur">

        <div class="mb-8 text-center">
            <h1 class="mb-2 text-3xl font-black">
                ورود به حساب
            </h1>

            <p class="text-slate-400">
                ادامه یادگیری گواهینامه آلمان
            </p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="mb-2 block text-sm text-slate-300">
                    نام کاربری
                </label>

                <input type="text" name="username" required
       class="w-full rounded-2xl border border-white/10 bg-slate-900 px-4 py-3 text-white outline-none ring-0 placeholder:text-slate-500 focus:border-blue-400"
       placeholder="نام کاربری">
            </div>

            <div>
                <label class="mb-2 block text-sm text-slate-300">
                    رمز عبور
                </label>

                <input type="password" name="password" required
       class="w-full rounded-2xl border border-white/10 bg-slate-900 px-4 py-3 text-white outline-none ring-0 placeholder:text-slate-500 focus:border-blue-400"
       placeholder="رمز عبور">
            </div>

            <button
                type="submit"
                class="w-full rounded-2xl bg-blue-500 px-5 py-3 font-bold transition hover:bg-blue-600"
            >
                ورود
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-400">
            حساب ندارید؟

            <a href="/accounts/register/" class="font-bold text-blue-400">
                ثبت‌نام
            </a>
        </p>

    </div>

</div>
{% endblock %}
